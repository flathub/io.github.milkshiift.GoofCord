app-id: io.github.milkshiift.GoofCord

runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk

base: org.electronjs.Electron2.BaseApp
base-version: '25.08'

command: startgoofcord
separate-locales: false

finish-args:
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --share=ipc
  - --talk-name=org.kde.StatusNotifierWatcher # Tray functionalities on KDE
  - --talk-name=com.canonical.Unity # For setBadgeCount to work
  - --device=all # Needed for GPU acceleration and the webcam
  - --filesystem=xdg-videos:ro
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-download # This and the above two are used for drag-n-drop, and download managing
  - --filesystem=xdg-run/pipewire-0:ro # Pipewire interfacing for Venmic
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons:/usr/share/icons # This is used to show the correct cursor on Wayland
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6

modules:
  - name: GoofCord
    buildsystem: simple
    build-commands:
      - chmod +x GoofCord.AppImage
      - ./GoofCord.AppImage --appimage-extract
      - desktop-file-edit --set-key="Exec" --set-value="startgoofcord" --set-icon=$FLATPAK_ID
        squashfs-root/io.github.milkshiift.GoofCord.desktop
      - install -D squashfs-root/usr/share/icons/hicolor/512x512/apps/goofcord.png
        /app/share/icons/hicolor/512x512/apps/io.github.milkshiift.GoofCord.png
      - install -D squashfs-root/io.github.milkshiift.GoofCord.desktop /app/share/applications/io.github.milkshiift.GoofCord.desktop
      - install -Dm755 startgoofcord /app/bin/startgoofcord
      - install -D io.github.milkshiift.GoofCord.metainfo.xml -t /app/share/metainfo/
      - mv squashfs-root /app/bin/goofcord

    sources:
      - type: file
        path: startgoofcord

      - type: file
        url: https://raw.githubusercontent.com/Milkshiift/GoofCord/v2.3.1/assetsDev/io.github.milkshiift.GoofCord.metainfo.xml
        sha512: 83e830acd7ea6c4eb87de01737349014e144074147fcd0e09fb37356df2796506233a4ad1f10e9ce178da6a436ec547f56f4b21c0a0551542f8804b01c8114c2
        x-checker-data:
          type: json
          url: https://api.github.com/repos/milkshiift/GoofCord/releases/latest
          tag-query: .tag_name
          url-query: '"https://raw.githubusercontent.com/Milkshiift/GoofCord/" + $tag
            + "/assetsDev/io.github.milkshiift.GoofCord.metainfo.xml"'
          version-query: $tag | sub("^v"; "")
          timestamp-query: .published_at

      - type: file
        url: https://github.com/Milkshiift/GoofCord/releases/download/v2.3.1/GoofCord-2.3.1-linux-x86_64.AppImage
        sha512: eb6cef9eb19d9a629758ab911b740125b74877e674d9ff2aea00877716b7d38de9ad37739050725de25492445cccbdfefb65fb7a625c76c0857790b501307e8b
        only-arches: [x86_64]
        dest-filename: GoofCord.AppImage
        x-checker-data:
          type: json
          url: https://api.github.com/repos/milkshiift/GoofCord/releases/latest
          tag-query: .tag_name
          version-query: $tag | sub("^v"; "")
          timestamp-query: .published_at
          url-query: '"https://github.com/Milkshiift/GoofCord/releases/download/"
            + $tag + "/GoofCord-" + $version + "-linux-x86_64.AppImage"'

      - type: file
        url: https://github.com/Milkshiift/GoofCord/releases/download/v2.3.1/GoofCord-2.3.1-linux-arm64.AppImage
        sha512: 268972bedcb3142f4fcafc35668071fc7a0c6199254b0d9f3fb64709679e815dd992fbbaabbc5859a7e77b2d6ef6fb21b0a43de67f6df03e68c4fc89c15be093
        only-arches: [aarch64]
        dest-filename: GoofCord.AppImage
        x-checker-data:
          type: json
          url: https://api.github.com/repos/milkshiift/GoofCord/releases/latest
          tag-query: .tag_name
          version-query: $tag | sub("^v"; "")
          timestamp-query: .published_at
          url-query: '"https://github.com/Milkshiift/GoofCord/releases/download/"
            + $tag + "/GoofCord-" + $version + "-linux-arm64.AppImage"'
